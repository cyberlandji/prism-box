title: Browser Started with Remote Debugging
id: cd9e640b-25ea-4fa6-b11c-5440c09b097c
status: test
description: |
    Detects browsers starting with remote-debugging flags, a technique used to drive the browser
    over the DevTools Protocol (CDP) - e.g. Network.getAllCookies to dump session cookies. Emulated
    as Magpie node 9 (Atomic Red Team T1539 test #4): a powershell script relaunches chrome.exe with
    --remote-debugging-port=9222 --profile-directory=Default and issues a CDP cookie dump. Sole
    coverage - Defender was silent across this node. Detection keys on the launch (the attempt),
    independent of outcome: on this host the theft failed against Chrome 151 (Default-profile DevTools
    hardening, exit -1), but the remote-debugging launch is fully captured regardless.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1539/T1539.md
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_browsers_remote_debugging.yml
    - https://github.com/defaultnamehere/cookie_crimes/
author: pH-T (Nextron Systems), Nasreddine Bencherchali (Nextron Systems) (original rule), Yohan Landji (Cyberlandji) (PB-02 adaptation)
date: 2026-08-16
related:
    - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
      type: derived
tags:
    - attack.credential-access
    - attack.collection
    - attack.t1539
    - attack.t1185
logsource:
    category: process_creation
    product: windows
detection:
    selection_chromium_based:
        # Covers: --remote-debugging-address, --remote-debugging-port, --remote-debugging-socket-name, --remote-debugging-pipe....etc
        CommandLine|contains: ' --remote-debugging-'
    selection_firefox:
        Image|endswith: '\firefox.exe'
        CommandLine|contains: ' -start-debugger-server'
    condition: 1 of selection_*
falsepositives:
    - Legitimate developer or automated browser-testing use of remote debugging (baseline expected hosts)
level: medium
